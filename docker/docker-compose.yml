# Mneme-rag 外部中间件编排（P6 real 栈 / pgvector 方案）
#
# 一键起 PG(带 pgvector) + Redis + MinIO，供 real 栈接线与复测使用。
# 用法（本目录下）：
#   docker compose up -d          # 启动全部服务
#   docker compose ps             # 查看状态
#   docker compose down -v        # 停止并删除数据卷（彻底重置）
#
# 连接信息（对应 app/config.py 的 RAGENT_* 环境变量）：
#   RAGENT_DATABASE_URL = postgresql+psycopg://postgres:postgres@localhost:5432/ragent
#   RAGENT_REDIS_URL    = redis://localhost:6379/0
#   RAGENT_OBJECT_STORAGE_BACKEND = s3
#   RAGENT_S3_ENDPOINT  = http://localhost:9000
#   RAGENT_S3_ACCESS_KEY = minioadmin
#   RAGENT_S3_SECRET_KEY = minioadmin
#
# 向量后端：RAGENT_VECTOR_STORE_TYPE=pgvector。
#   - pgvector 扩展由镜像内置（pgvector/pgvector:pg16），wiring 启动时
#     `CREATE EXTENSION IF NOT EXISTS vector` 自动启用（见 app/wiring.py _build_pgvector_stack）；
#   - MinIO 桶由 minio-init 一次性任务预建（ragent-sources 私有 / ragent-assets 公共读），
#     代码侧 create_bucket 亦幂等兜底。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragent-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ragent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: ragent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 一次性初始化：预建知识库桶（私有）与资产桶（公共读），跑完即退出
  minio-init:
    image: minio/mc
    container_name: ragent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ragent-sources local/ragent-assets &&
      mc anonymous set download local/ragent-assets &&
      exit 0
      "
    restart: "no"

volumes:
  pgdata:
  minio-data:
